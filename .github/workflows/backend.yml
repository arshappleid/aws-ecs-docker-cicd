name: Deploy Backend Service

on:
    push:
        branches: ["stage", "prod", "dev"]
        paths:
            - "backend/**"
            - ".aws/backend-*-taskDefinition.json"
    workflow_dispatch:

env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY_NAME: prab-cicd-backend
    ECS_SERVICE: backend
    GITHUB_ACTION_IAM_ROLE: arn:aws:iam::866934333672:role/GITHUB-ACTIONS-ALL-REPO
    CONTAINER_NAME: flask-api
    REPO_ROOT_FOLDER_NAME: backend
    UNIT_TEST_PATH: tests/unit
    API_TESTS_PATH: backtests/api
    API_BASE_URL: http://prab-cicd-api-alb-1337318245.us-east-1.elb.amazonaws.com

permissions:
    id-token: write
    contents: read

jobs:
    build:
        name: Build Source Code
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            image: ${{ steps.build-image.outputs.image }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Set up Docker Build
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ env.GITHUB_ACTION_IAM_ROLE }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: Build and push ${{ env.ECR_REPOSITORY_NAME }} image
              id: build-image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker build --platform linux/amd64 \
                      -t $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG \
                      -t $ECR_REGISTRY/$ECR_REPOSITORY_NAME:latest \
                      -f $REPO_ROOT_FOLDER_NAME/Dockerfile \
                      $REPO_ROOT_FOLDER_NAME
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY_NAME:latest
                  echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

    unit_test:
        name: Unit Testing
        runs-on: ubuntu-24.04
        needs: build
        if: ${{ needs.build.result == 'success' }}
        timeout-minutes: 10

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.GITHUB_ACTION_IAM_ROLE }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Pull image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: docker pull $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG

            - name: Run Trivy Vulnerability Scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: ${{ needs.build.outputs.image }}
                  format: "table"
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: "os,library"
                  severity: "CRITICAL,HIGH"

            - name: Start container
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  docker run -d \
                    --name backend-test \
                    $ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG \
                    tail -f /dev/null

            - name: Run pytest
              run: docker exec backend-test pytest ${{ env.UNIT_TEST_PATH }} -v

            - name: Stop container
              if: always()
              run: docker rm -f backend-test
    static-scan:
        name: Static Application Security Testing (SAST)
        runs-on: ubuntu-latest
        needs: unit_test
        if: ${{ needs.unit_test.result == 'success' }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            # Using Semgrep for fast, accurate static analysis
            - name: Run Semgrep SAST
              uses: semgrep/semgrep-action@v1
              with:
                  config: p/security-audit

    deploy:
        name: Deploy Backend Service
        runs-on: ubuntu-24.04
        needs: [build, unit_test, static-scan]
        if: ${{ needs.unit_test.result == 'success' && needs.static-scan.result == 'success' }}
        # environment maps to the branch name (dev / stage / prod).
        # Configure required reviewers for the "prod" environment in:
        # GitHub → Settings → Environments → prod → Required reviewers
        environment: ${{ github.ref_name }}
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                  role-to-assume: ${{ env.GITHUB_ACTION_IAM_ROLE }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Fill in the new image ID in task definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              with:
                  task-definition: ${{ vars.ECS_TASK_DEFINITION }}
                  container-name: ${{ env.CONTAINER_NAME }}
                  image: ${{ env.ECR_REGISTRY }}/${{env.ECR_REPOSITORY_NAME}}:${{env.IMAGE_TAG}}
            
            # ADD THIS VERIFICATION STEP HERE:
            - name: Verify Rendered Task Definition
              run: |
                echo "=== Printing Generated Task Definition ==="
                cat ${{ steps.task-def.outputs.task-definition }}
                echo "=========================================="

            - name: Deploy Amazon ECS task definition
              uses: aws-actions/amazon-ecs-deploy-task-definition@v1
              with:
                  task-definition: ${{ steps.task-def.outputs.task-definition }}
                  service: ${{ env.ECS_SERVICE }}
                  cluster: ${{ vars.ECS_CLUSTER }}
                  wait-for-service-stability: true

    api_test:
        name: API Testing
        runs-on: ubuntu-24.04
        needs: deploy
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Install Bruno CLI
              run: npm install -g @usebruno/cli@3
           
            - name: Run Bruno demo collection
              working-directory: ${{ env.API_TESTS_PATH }}
              run: |
                  bru run \
                    --env prod \
                    --env-var baseUrl="${{ env.API_BASE_URL }}" \
                    --env-var platform_name="GitHub Actions" \
                    --env-var build_id="${{ github.run_id }}" \
                    --env-var commit_sha="${{ github.sha }}"
